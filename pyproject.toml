[project]
name = "tp-integrador"
version = "0.1.0"
description = "TP Final Integrador — Certificación Desarrollador de Agentes de IA (ITBA)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
